<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Meet the students, postdoctoral fellows, and research staff working across the NYU Center for Neural Science.">
  <meta name="theme-color" content="#f5f4ef">
  <title>Trainee Directory | Center for Neural Science</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --white: #fffefa;
      --ink: #333333;
      --muted: #666666;
      --line: #c9c9c9;
      --green: #57068c;
      --green-soft: #e4ebe3;
      --red: #963d32;
      --serif: "NYUPerstare", Helvetica, Arial, sans-serif;
      --sans: Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    a { color: inherit; }

    .masthead {
      border: 0;
      background: var(--green);
    }

    .masthead-inner,
    main,
    footer {
      width: min(1100px, calc(100% - 48px));
      margin-inline: auto;
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      min-height: 60px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main { padding-block: 44px 72px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      align-items: end;
      gap: 30px;
      padding: 20px 0 32px;
      border-bottom: 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      color: var(--green);
      font-family: var(--sans);
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .intro-copy {
      max-width: 30rem;
      margin: 14px 0 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(190px, 260px) auto;
      gap: 12px;
      padding-block: 24px;
    }

    .controls label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #aeb7ad;
      border-radius: 2px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
    }

    .archive-toggle,
    .compact-toggle {
      display: flex !important;
      align-items: center;
      gap: 8px;
      align-self: end;
      min-height: 23px;
      margin: 0;
      color: var(--ink) !important;
      font-size: 0.85rem !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
    }

    .archive-toggle input,
    .compact-toggle input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--green);
    }

    input:focus,
    select:focus,
    a:focus-visible {
      outline: 3px solid #c57758;
      outline-offset: 2px;
    }

    .directory-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .role-section { scroll-margin-top: 20px; }

    .role-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 24px 0 0;
      padding: 8px 0 10px;
      border-bottom: 1px solid #444444;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .role-count {
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.8rem;
    }

    .person {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      animation: arrive 320ms ease both;
    }

    .person.no-photo { grid-template-columns: minmax(0, 1fr); }

    .person img {
      display: block;
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--green-soft);
    }

    .person-info { grid-column: 2; grid-row: 1; align-self: center; min-width: 0; }
    .person.no-photo .person-info { grid-column: 1; }

    .person h3 {
      margin: 0 0 3px;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .person-role { margin: 0 0 12px; color: var(--muted); font-weight: 700; }
    .person-detail { margin: 0; font-size: 0.93rem; }

    .detail-line {
      display: grid;
      grid-template-columns: 7.5rem minmax(0, 1fr);
      column-gap: 0.75rem;
      align-items: baseline;
    }

    .detail-label { color: var(--muted); text-align: right; }

    .people-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.9rem;
      animation: arrive 320ms ease both;
    }

    .people-table th,
    .people-table td {
      padding: 7px 12px 7px 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }

    .people-table th {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .name-cell { color: var(--green); font-weight: 700; }

    .sort-menu { position: relative; display: inline-block; margin-left: 4px; }
    .sort-menu summary { list-style: none; cursor: pointer; }
    .sort-menu summary::-webkit-details-marker { display: none; }
    .sort-options {
      position: absolute;
      z-index: 2;
      top: 100%;
      left: 0;
      display: grid;
      min-width: 7.5rem;
      border: 1px solid var(--line);
      background: var(--white);
    }
    .sort-options button {
      padding: 6px 10px;
      border: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 0.8rem;
      letter-spacing: 0;
      text-align: left;
      text-transform: none;
      cursor: pointer;
    }
    .sort-options button[aria-pressed="true"] { color: var(--green); font-weight: 700; }

    .photo-col { width: 76px; text-align: center !important; }
    .photo-col img {
      display: block;
      margin-inline: auto;
      width: 56px;
      height: 56px;
      object-fit: cover;
      background: var(--green-soft);
    }

    @media (max-width: 900px) {
      .photo-col { display: none; }
    }

    .archived-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .people-table td:not(.name-cell) { color: var(--muted); }
    .people-table td:not(.name-cell) a,
    .person-detail a { color: var(--ink); text-underline-offset: 3px; overflow-wrap: anywhere; }

    .empty-state,
    .load-error {
      margin: 20px 0;
      padding: 18px;
      border-left: 3px solid var(--red);
      background: var(--white);
      color: var(--muted);
    }

    .load-error code { color: var(--ink); }

    footer {
      padding-block: 18px 30px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
    }

    [hidden] { display: none !important; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 650px) {
      .masthead-inner, main, footer { width: min(100% - 32px, 1100px); }
      main { padding-top: 38px; }
      .intro { grid-template-columns: 1fr; gap: 12px; }
      h1 { font-size: 2.35rem; }
      .controls { grid-template-columns: 1fr; gap: 14px; }
      .role-section { overflow-x: auto; }
      .people-table { min-width: 620px; }
      .person { grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
      .directory-meta { align-items: baseline; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">NYU  |  Center for Neural Science  |  People</div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <!-- <p class="eyebrow">Our community</p> -->
        <h1 id="page-title">Trainee Directory</h1>
        <p class="intro-copy">Meet the students, postdoctoral fellows, and research staff working across the Center for Neural Science.</p>
      </div>
    </section>

    <section class="controls" aria-label="Directory filters">
      <div>
        <label for="search">Search trainees</label>
        <input id="search" type="search" placeholder="Name, email, or lab" autocomplete="off">
      </div>
      <div>
        <label for="role-filter">Filter by role</label>
        <select id="role-filter"><option value="">All roles</option></select>
      </div>
      <div>
        <label class="archive-toggle" for="show-archived">
          <input id="show-archived" type="checkbox">
          See archived profiles
        </label>
        <label class="compact-toggle" for="compact-view">
          <input id="compact-view" type="checkbox" checked>
          Compact view
        </label>
      </div>
    </section>

    <div class="directory-meta" aria-live="polite">
      <span id="result-count">Loading directory...</span>
      <span id="archive-summary">Listed by role</span>
    </div>
    <div id="directory" aria-live="polite"></div>
  </main>
  <footer>Center for Neural Science</footer>

  <script type="module">
    import {
      ARCHIVE_AGE_MONTHS, PUBLISHED_CSV_URL, archiveCutoff, createFacultyLinker, groupByRole,
      isArchived, latestPeople, parseCsv, siteLinks,
    } from "./directory-core.js";

    const facultyRosterPath = "sources/faculty-directory.json";
    const imagePath = "sources/no_image.png";
    const directory = document.querySelector("#directory");
    const searchInput = document.querySelector("#search");
    const roleFilter = document.querySelector("#role-filter");
    const resultCount = document.querySelector("#result-count");
    const showArchivedInput = document.querySelector("#show-archived");
    const archiveSummary = document.querySelector("#archive-summary");
    const compactInput = document.querySelector("#compact-view");
    let linkLab = (lab) => [{ text: lab }];
    let allPeople = [];
    const sortModes = new Map();
    const defaultSort = { key: "first", dir: 1 };

    function sortPeople(people, { key, dir }) {
      const labText = (person) => labContent(person).textContent;
      const fields = key === "last" ? ["last", "first"] : ["first", "last"];
      return [...people].sort((a, b) => {
        if (key === "lab") {
          const labA = labText(a);
          const labB = labText(b);
          // People without a lab stay at the bottom in either direction.
          if (!labA !== !labB) return labA ? -1 : 1;
          const result = labA.localeCompare(labB);
          if (result) return result * dir;
        } else {
          const result = a[fields[0]].localeCompare(b[fields[0]]) || a[fields[1]].localeCompare(b[fields[1]]);
          if (result) return result * dir;
        }
        return a.name.localeCompare(b.name);
      });
    }

    function makeText(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function labContent(person) {
      const content = document.createDocumentFragment();
      if (!person.lab) return content;
      const segments = linkLab(person.lab);
      const faculty = segments.filter((segment) => segment.url);
      // Unmatched labs fall back to the submitted text.
      const shown = faculty.length ? faculty : segments;
      const seen = new Set();
      for (const segment of shown) {
        const text = faculty.length ? `${segment.text.trim().split(/\s+/).at(-1)} lab` : segment.text;
        if (faculty.length && seen.has(text)) continue;
        seen.add(text);
        if (content.hasChildNodes()) content.append(document.createTextNode(", "));
        if (!segment.url) {
          content.append(document.createTextNode(text));
          continue;
        }
        const link = document.createElement("a");
        link.href = segment.url;
        link.textContent = text;
        content.append(link);
      }
      return content;
    }

    function emailContent(person) {
      const content = document.createDocumentFragment();
      if (!person.email.includes("@")) return content;
      const link = document.createElement("a");
      link.href = `mailto:${person.email}`;
      link.textContent = person.email;
      content.append(link);
      return content;
    }

    function siteContent(person) {
      const content = document.createDocumentFragment();
      if (!person.website) return content;
      siteLinks(person.website).forEach((site, index) => {
        if (index > 0) content.append(document.createTextNode("; "));
        const link = document.createElement("a");
        link.href = site.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = site.text;
        content.append(link);
      });
      return content;
    }

    function render(people) {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const role = roleFilter.value;
      const matchingPeople = people.filter((person) => {
        const matchesRole = !role || person.role === role;
        const haystack = `${person.name} ${person.email} ${person.lab} ${person.role} ${person.website}`.toLocaleLowerCase();
        return matchesRole && haystack.includes(query);
      });
      const cutoff = archiveCutoff(ARCHIVE_AGE_MONTHS);
      const archivedPeople = matchingPeople.filter((person) => isArchived(person, cutoff));
      const currentPeople = matchingPeople.filter((person) => !isArchived(person, cutoff));
      const visible = showArchivedInput.checked
        ? archivedPeople
        : currentPeople;
      resultCount.textContent = `${visible.length} ${visible.length === 1 ? "person" : "people"}`;
      archiveSummary.textContent = showArchivedInput.checked
        ? "Showing archived profiles"
        : `${archivedPeople.length} archived hidden`;
      directory.replaceChildren();

      if (!visible.length) {
        directory.append(makeText("p", "empty-state", "No trainees match your search."));
        return;
      }

      for (const [groupName, groupPeople] of groupByRole(visible)) {
        const section = document.createElement("section");
        section.className = "role-section";
        const heading = makeText("h2", "role-heading", groupName);
        heading.append(makeText("span", "role-count", String(groupPeople.length)));
        section.append(heading);
        section.append(compactInput.checked ? buildTable(groupName, groupPeople, cutoff) : buildCards(groupPeople, cutoff));
        directory.append(section);
      }
    }

    function buildCards(groupPeople, cutoff) {
      const list = document.createElement("div");
      for (const person of groupPeople) {
        const article = document.createElement("article");
        const archived = isArchived(person, cutoff);
        article.className = archived ? "person is-archived" : "person";
        const image = document.createElement("img");
        image.src = imagePath;
        image.alt = `Placeholder portrait for ${person.name}`;
        image.addEventListener("error", () => {
          image.remove();
          article.classList.add("no-photo");
        }, { once: true });
        article.append(image);

        const details = document.createElement("div");
        details.className = "person-info";
        details.append(makeText("h3", "", person.name));
        if (archived) details.append(makeText("span", "archived-badge", "Archived"));
        if (person.role) details.append(makeText("p", "person-role", person.role));
        const detailList = document.createElement("p");
        detailList.className = "person-detail";
        const affiliationContent = document.createDocumentFragment();
        if (person.previousAffiliation) affiliationContent.append(document.createTextNode(person.previousAffiliation));
        for (const [label, content] of [["Lab", labContent(person)], ["Email", emailContent(person)], ["Prior affiliation", affiliationContent], ["Site", siteContent(person)]]) {
          if (!content.hasChildNodes()) continue;
          const line = makeText("span", "detail-line", "");
          line.append(makeText("span", "detail-label", label));
          const value = document.createElement("span");
          value.append(content);
          line.append(value);
          detailList.append(line);
        }
        details.append(detailList);
        article.append(details);
        list.append(article);
      }
      return list;
    }

    function buildTable(groupName, groupPeople, cutoff) {
        const mode = sortModes.get(groupName) || defaultSort;
        const sortChoices = {
          Name: [["first", 1, "First name A\u2013Z"], ["first", -1, "First name Z\u2013A"], ["last", 1, "Last name A\u2013Z"], ["last", -1, "Last name Z\u2013A"]],
          "Lab(s)": [["lab", 1, "A\u2013Z"], ["lab", -1, "Z\u2013A"]],
        };
        const table = document.createElement("table");
        table.className = "people-table";
        const headRow = table.createTHead().insertRow();
        for (const label of ["Photo", "Name", "Lab(s)", "Email", "Website"]) {
          const th = makeText("th", label === "Photo" ? "photo-col" : "", label === "Photo" ? "" : label);
          if (label === "Photo") th.setAttribute("aria-label", "Photo");
          th.scope = "col";
          if (sortChoices[label]) {
            const menu = document.createElement("details");
            menu.className = "sort-menu";
            const summary = makeText("summary", "", "\u25BE");
            summary.setAttribute("aria-label", `Sort ${label}`);
            const options = document.createElement("div");
            options.className = "sort-options";
            for (const [key, dir, text] of sortChoices[label]) {
              const button = makeText("button", "", text);
              button.type = "button";
              button.setAttribute("aria-pressed", String(mode.key === key && mode.dir === dir));
              button.addEventListener("click", () => {
                sortModes.set(groupName, { key, dir });
                render(allPeople);
              });
              options.append(button);
            }
            menu.append(summary, options);
            th.append(menu);
          }
          headRow.append(th);
        }
        const body = table.createTBody();

        for (const person of sortPeople(groupPeople, mode)) {
          const archived = isArchived(person, cutoff);
          const row = body.insertRow();
          if (archived) row.className = "is-archived";
          const photoCell = row.insertCell();
          photoCell.className = "photo-col";
          const image = document.createElement("img");
          image.src = imagePath;
          image.alt = `Placeholder portrait for ${person.name}`;
          image.addEventListener("error", () => image.remove(), { once: true });
          photoCell.append(image);
          const nameCell = row.insertCell();
          nameCell.className = "name-cell";
          nameCell.append(person.name);
          if (archived) nameCell.append(makeText("span", "archived-badge", "Archived"));

          const labValue = row.insertCell();
          labValue.append(labContent(person));
          row.insertCell().append(emailContent(person));
          row.insertCell().append(siteContent(person));
        }
        return table;
    }

    async function loadDirectory() {
      try {
        const facultyResponse = await fetch(facultyRosterPath);
        if (!facultyResponse.ok) throw new Error(`Faculty roster request returned ${facultyResponse.status}`);
        const facultyRoster = await facultyResponse.json();
        linkLab = createFacultyLinker(Array.isArray(facultyRoster.faculty) ? facultyRoster.faculty : []);
      } catch (error) {
        console.warn("Unable to load faculty profile links", error);
      }

      try {
        const response = await fetch(PUBLISHED_CSV_URL);
        if (!response.ok) throw new Error(`CSV request returned ${response.status}`);
        const people = latestPeople(parseCsv(await response.text()));
        allPeople = people;
        const roles = [...new Set(people.map((person) => person.role).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        for (const role of roles) {
          const option = document.createElement("option");
          option.value = role;
          option.textContent = role;
          roleFilter.append(option);
        }
        render(people);
        searchInput.addEventListener("input", () => render(people));
        roleFilter.addEventListener("change", () => render(people));
        showArchivedInput.addEventListener("change", () => render(people));
        compactInput.addEventListener("change", () => render(people));
      } catch (error) {
        resultCount.textContent = "";
        const message = document.createElement("p");
        message.className = "load-error";
        message.textContent = "Trainee directory data failed to load. Please contact CNS IT";
        directory.replaceChildren(message);
        console.error("Unable to load trainee directory", error);
      }
    }

    loadDirectory();
  </script>
</body>
</html>
