<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Trainee Directory | Center for Neural Science</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --white: #fffefa;
      --ink: #333333;
      --muted: #666666;
      --line: #c9c9c9;
      --green: #57068c;
      --green-soft: #e4ebe3;
      --red: #963d32;
      --serif: "NYUPerstare", Helvetica, Arial, sans-serif;
      --sans: Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    a { color: inherit; }

    .masthead {
      border: 0;
      background: var(--green);
    }

    .masthead-inner,
    main,
    footer {
      width: min(1100px, calc(100% - 48px));
      margin-inline: auto;
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      min-height: 60px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main { padding-block: 44px 72px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      align-items: end;
      gap: 30px;
      padding: 20px 0 32px;
      border-bottom: 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      color: var(--green);
      font-family: var(--sans);
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .intro-copy {
      max-width: 30rem;
      margin: 14px 0 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(190px, 260px) auto;
      gap: 12px;
      padding-block: 24px;
    }

    .controls label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #aeb7ad;
      border-radius: 2px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
    }

    .archive-toggle {
      display: flex !important;
      align-items: center;
      gap: 8px;
      align-self: end;
      min-height: 46px;
      margin: 0;
      color: var(--ink) !important;
      font-size: 0.85rem !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
    }

    .archive-toggle input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--green);
    }

    input:focus,
    select:focus,
    a:focus-visible {
      outline: 3px solid #c57758;
      outline-offset: 2px;
    }

    .directory-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .role-section { scroll-margin-top: 20px; }

    .role-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 24px 0 0;
      padding: 8px 0 10px;
      border-bottom: 1px solid #444444;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .role-count {
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.8rem;
    }

    .person {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      animation: arrive 320ms ease both;
    }

    .person.no-photo { grid-template-columns: minmax(0, 1fr); }

    .person img {
      display: block;
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--green-soft);
    }

    .person-info { grid-column: 1; grid-row: 1; align-self: center; min-width: 0; }

    .person h3 {
      margin: 0 0 3px;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .person-role { margin: 0 0 12px; color: var(--muted); font-weight: 700; }

    .archived-badge {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .person-detail {
      margin: 0;
      font-size: 0.93rem;
    }

    .detail-line {
      display: grid;
      grid-template-columns: 3.5rem minmax(0, 1fr);
      align-items: baseline;
    }

    .person-detail a { min-width: 0; overflow-wrap: anywhere; color: var(--green); text-underline-offset: 3px; }
    .detail-label { color: var(--muted); }

    .empty-state,
    .load-error {
      margin: 20px 0;
      padding: 18px;
      border-left: 3px solid var(--red);
      background: var(--white);
      color: var(--muted);
    }

    .load-error code { color: var(--ink); }

    footer {
      padding-block: 18px 30px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
    }

    [hidden] { display: none !important; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 650px) {
      .masthead-inner, main, footer { width: min(100% - 32px, 1100px); }
      main { padding-top: 38px; }
      .intro { grid-template-columns: 1fr; gap: 12px; }
      h1 { font-size: 2.35rem; }
      .controls { grid-template-columns: 1fr; gap: 14px; }
      .person { grid-template-columns: minmax(0, 1fr) 120px; gap: 16px; padding-inline: 0; }
      .person h3 { font-size: 1rem; }
      .directory-meta { align-items: baseline; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">Center for Neural Science · People</div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <!-- <p class="eyebrow">Our community</p> -->
        <h1 id="page-title">Trainee Directory</h1>
        <p class="intro-copy">Meet the students, postdoctoral fellows, and research staff working across the Center for Neural Science.</p>
      </div>
    </section>

    <section class="controls" aria-label="Directory filters">
      <div>
        <label for="search">Search trainees</label>
        <input id="search" type="search" placeholder="Name, email, or lab" autocomplete="off">
      </div>
      <div>
        <label for="role-filter">Filter by role</label>
        <select id="role-filter"><option value="">All roles</option></select>
      </div>
      <div>
        <label class="archive-toggle" for="show-archived">
          <input id="show-archived" type="checkbox">
          See archived profiles
        </label>
      </div>
    </section>

    <div class="directory-meta" aria-live="polite">
      <span id="result-count">Loading directory…</span>
      <span id="archive-summary">Listed by role</span>
    </div>
    <div id="directory" aria-live="polite"></div>
  </main>
  <footer>Center for Neural Science</footer>

  <script>
    const csvPath = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRI-bsWtUw-xHXXn8wznvhXg3htUK4281nrDdDYrPe5OMFqlmdfYaA8GPQ-gic2QFSq7jyiNGi9bnl3/pub?gid=1236118581&single=true&output=csv";
    const facultyRosterPath = "sources/faculty-directory.json";
    const imagePath = "sources/no_image.png";
    const directory = document.querySelector("#directory");
    const searchInput = document.querySelector("#search");
    const roleFilter = document.querySelector("#role-filter");
    const resultCount = document.querySelector("#result-count");
    const showArchivedInput = document.querySelector("#show-archived");
    const archiveSummary = document.querySelector("#archive-summary");
    const archiveAgeMonths = 12;
    let facultyAliasLookup = new Map();
    let facultyAliasPattern = null;
    const facultyAliasOverrides = [
      { alias: "Tony Movshon", name: "J. Anthony Movshon" },
    ];

    function normalizeFacultyName(name) {
      return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
    }

    function normalizeWithOffsets(value) {
      const characters = [];
      const sourceStarts = [];
      const sourceEnds = [];
      for (let offset = 0; offset < value.length;) {
        const sourceCharacter = String.fromCodePoint(value.codePointAt(offset));
        const nextOffset = offset + sourceCharacter.length;
        const normalizedCharacters = sourceCharacter.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase();
        for (const character of normalizedCharacters) {
          const normalizedCharacter = /[\p{L}\p{N}]/u.test(character) ? character : " ";
          if (normalizedCharacter === " " && (!characters.length || characters.at(-1) === " ")) {
            if (characters.length) sourceEnds[sourceEnds.length - 1] = nextOffset;
            continue;
          }
          characters.push(normalizedCharacter);
          sourceStarts.push(offset);
          sourceEnds.push(nextOffset);
        }
        offset = nextOffset;
      }
      while (characters.at(-1) === " ") {
        characters.pop();
        sourceStarts.pop();
        sourceEnds.pop();
      }
      return { text: characters.join(""), sourceStarts, sourceEnds };
    }

    function buildFacultyMatcher(facultyDirectory) {
      const facultyByName = new Map();
      for (const person of facultyDirectory) {
        const key = normalizeFacultyName(person.name);
        if (key && !facultyByName.has(key)) facultyByName.set(key, person);
      }

      const surnameCounts = new Map();
      for (const person of facultyByName.values()) {
        const surname = normalizeFacultyName(person.name).split(" ").at(-1);
        surnameCounts.set(surname, (surnameCounts.get(surname) || 0) + 1);
      }

      const aliases = new Map();
      const ambiguousAliases = new Set();
      const addAlias = (alias, person) => {
        const key = normalizeFacultyName(alias);
        if (!key || ambiguousAliases.has(key)) return;
        const existing = aliases.get(key);
        if (!existing) aliases.set(key, person);
        else if (existing.url !== person.url) {
          aliases.delete(key);
          ambiguousAliases.add(key);
        }
      };

      for (const person of facultyByName.values()) {
        const nameParts = person.name.split(/\s+/);
        const first = nameParts[0];
        const surname = nameParts.at(-1);
        const variants = new Set([
          person.name,
          `${first} ${surname}`,
          person.name.normalize("NFD").replace(/[\u0300-\u036f]/g, ""),
          `${first.normalize("NFD").replace(/[\u0300-\u036f]/g, "")} ${surname.normalize("NFD").replace(/[\u0300-\u036f]/g, "")}`,
        ]);
        for (const alias of variants) addAlias(alias, person);
        if (surnameCounts.get(normalizeFacultyName(surname)) === 1) addAlias(surname, person);
      }

      for (const override of facultyAliasOverrides) {
        const person = [...facultyByName.values()].find((entry) => normalizeFacultyName(entry.name) === normalizeFacultyName(override.name));
        if (person) addAlias(override.alias, person);
      }

      facultyAliasLookup = aliases;
      const patterns = [...facultyAliasLookup.keys()]
        .sort((a, b) => b.length - a.length)
        .map((alias) => alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      facultyAliasPattern = patterns.length
        ? new RegExp(`(^| )(${patterns.join("|")})(?=$| )`, "giu")
        : null;
    }

    function appendLabLinks(container, lab) {
      if (!facultyAliasPattern) {
        container.textContent = lab;
        return;
      }
      const normalizedLab = normalizeWithOffsets(lab);
      let cursor = 0;
      for (const match of normalizedLab.text.matchAll(facultyAliasPattern)) {
        const normalizedStart = match.index + match[1].length;
        const normalizedEnd = normalizedStart + match[2].length;
        const start = normalizedLab.sourceStarts[normalizedStart];
        const end = normalizedLab.sourceEnds[normalizedEnd - 1];
        container.append(document.createTextNode(lab.slice(cursor, start)));
        const faculty = facultyAliasLookup.get(match[2]);
        const link = document.createElement("a");
        if (faculty && start >= cursor && end > start) {
          link.href = faculty.url;
          link.textContent = lab.slice(start, end);
          container.append(link);
          cursor = end;
        }
      }
      container.append(document.createTextNode(lab.slice(cursor)));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        if (quoted) {
          if (character === '"' && text[index + 1] === '"') {
            value += '"';
            index += 1;
          } else if (character === '"') {
            quoted = false;
          } else {
            value += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(value);
          value = "";
        } else if (character === "\n" || character === "\r") {
          if (character === "\r" && text[index + 1] === "\n") index += 1;
          row.push(value);
          if (row.some((cell) => cell.trim())) rows.push(row);
          row = [];
          value = "";
        } else {
          value += character;
        }
      }
      row.push(value);
      if (row.some((cell) => cell.trim())) rows.push(row);

      const headers = rows.shift().map((header) => header.trim().replace(/^\uFEFF/, ""));
      return rows.map((cells) => Object.fromEntries(headers.map((header, index) => [header, (cells[index] || "").trim()])));
    }

    function parseTimestamp(value) {
      const match = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(value.trim());
      if (!match) {
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }
      const [, month, day, year, hour = "0", minute = "0", second = "0"] = match;
      const timestamp = new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second));
      if (timestamp.getFullYear() !== Number(year) || timestamp.getMonth() !== Number(month) - 1 || timestamp.getDate() !== Number(day)) return null;
      return timestamp;
    }

    function archiveCutoff(months, now = new Date()) {
      const cutoff = new Date(now);
      const day = cutoff.getDate();
      cutoff.setDate(1);
      cutoff.setMonth(cutoff.getMonth() - months);
      const lastDay = new Date(cutoff.getFullYear(), cutoff.getMonth() + 1, 0).getDate();
      cutoff.setDate(Math.min(day, lastDay));
      return cutoff;
    }

    function latestPeople(rows) {
      const people = new Map();
      for (const row of rows) {
        const first = row["First Name"] || "";
        const last = row["Last Name"] || "";
        const name = `${first} ${last}`.trim().replace(/\s+/g, " ");
        if (!name) continue;
        const key = name.toLocaleLowerCase();
        const timestamp = parseTimestamp(row.Timestamp || "");
        const existing = people.get(key);
        if (existing?.timestamp && (!timestamp || timestamp < existing.timestamp)) continue;
        people.set(key, {
          name,
          timestamp,
          email: row["Your Email Address"] || "",
          lab: row["Your Lab/PI"] || "",
          role: row["Current Role"] || "",
          website: row["Personal/Professional Website URL"] || "",
        });
      }
      return [...people.values()].sort((a, b) => a.name.localeCompare(b.name));
    }

    function makeText(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function render(people) {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const role = roleFilter.value;
      const matchingPeople = people.filter((person) => {
        const matchesRole = !role || person.role === role;
        const haystack = `${person.name} ${person.email} ${person.lab} ${person.role} ${person.website}`.toLocaleLowerCase();
        return matchesRole && haystack.includes(query);
      });
      const cutoff = archiveCutoff(archiveAgeMonths);
      const archivedPeople = matchingPeople.filter((person) => person.timestamp && person.timestamp < cutoff);
      const currentPeople = matchingPeople.filter((person) => !person.timestamp || person.timestamp >= cutoff);
      const visible = showArchivedInput.checked
        ? archivedPeople
        : currentPeople;
      resultCount.textContent = `${visible.length} ${visible.length === 1 ? "person" : "people"}`;
      archiveSummary.textContent = showArchivedInput.checked
        ? "Showing archived profiles"
        : `${archivedPeople.length} archived hidden`;
      directory.replaceChildren();

      if (!visible.length) {
        directory.append(makeText("p", "empty-state", "No trainees match your search."));
        return;
      }

      const groups = new Map();
      for (const person of visible) {
        const groupName = person.role || "Role not listed";
        if (!groups.has(groupName)) groups.set(groupName, []);
        groups.get(groupName).push(person);
      }

      for (const [groupName, groupPeople] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
        const section = document.createElement("section");
        section.className = "role-section";
        const heading = makeText("h2", "role-heading", groupName);
        heading.append(makeText("span", "role-count", String(groupPeople.length)));
        section.append(heading);

        for (const person of groupPeople) {
          const article = document.createElement("article");
          const isArchived = person.timestamp && person.timestamp < cutoff;
          article.className = isArchived ? "person is-archived" : "person";
          const image = document.createElement("img");
          image.src = imagePath;
          image.alt = `Placeholder portrait for ${person.name}`;
          image.addEventListener("error", () => {
            image.remove();
            article.classList.add("no-photo");
          }, { once: true });
          article.append(image);

          const details = document.createElement("div");
          details.className = "person-info";
          details.append(makeText("h3", "", person.name));
          if (isArchived) details.append(makeText("span", "archived-badge", "Archived"));
          if (person.role) details.append(makeText("p", "person-role", person.role));
          const detailList = document.createElement("p");
          detailList.className = "person-detail";
          if (person.lab) {
            const labLine = makeText("span", "detail-line", "");
            labLine.append(makeText("span", "detail-label", "Lab"));
            const labValue = document.createElement("span");
            appendLabLinks(labValue, person.lab);
            labLine.append(labValue);
            detailList.append(labLine);
          }
          if (person.email) {
            const emailLine = makeText("span", "detail-line", "");
            emailLine.append(makeText("span", "detail-label", "Email"));
            const emailLink = document.createElement("a");
            emailLink.href = `mailto:${person.email}`;
            emailLink.textContent = person.email;
            emailLine.append(emailLink);
            detailList.append(emailLine);
          }
          if (person.website) {
            const siteLine = makeText("span", "detail-line", "");
            siteLine.append(makeText("span", "detail-label", "Site"));
            const siteValue = document.createElement("span");
            const sites = person.website.split(/\s*;\s*/).filter(Boolean);
            sites.forEach((site, index) => {
              if (index > 0) siteValue.append(document.createTextNode("; "));
              const siteLink = document.createElement("a");
              const href = /^https?:\/\//i.test(site) ? site : `https://${site}`;
              siteLink.href = href;
              siteLink.target = "_blank";
              siteLink.rel = "noopener noreferrer";
              let linkText = site;
              try {
                const hostname = new URL(href).hostname.toLowerCase();
                if (/(^|\.)linkedin\.com$/.test(hostname)) linkText = "LinkedIn";
                if (/(^|\.)github\.(com|io)$/.test(hostname)) linkText = "GitHub";
                if (/(^|\.)scholar\.google\.com$/.test(hostname)) linkText = "Google Scholar";
                if (/(^|\.)(linktr\.ee|linktree\.com)$/.test(hostname)) linkText = "Linktree";
              } catch {}
              siteLink.textContent = linkText;
              siteValue.append(siteLink);
            });
            siteLine.append(siteValue);
            detailList.append(siteLine);
          }
          details.append(detailList);
          article.append(details);
          section.append(article);
        }
        directory.append(section);
      }
    }

    async function loadDirectory() {
      try {
        const facultyResponse = await fetch(facultyRosterPath);
        if (!facultyResponse.ok) throw new Error(`Faculty roster request returned ${facultyResponse.status}`);
        const facultyRoster = await facultyResponse.json();
        buildFacultyMatcher(Array.isArray(facultyRoster.faculty) ? facultyRoster.faculty : []);
      } catch (error) {
        console.warn("Unable to load faculty profile links", error);
      }

      try {
        const response = await fetch(csvPath);
        if (!response.ok) throw new Error(`CSV request returned ${response.status}`);
        const people = latestPeople(parseCsv(await response.text()));
        const roles = [...new Set(people.map((person) => person.role).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        for (const role of roles) {
          const option = document.createElement("option");
          option.value = role;
          option.textContent = role;
          roleFilter.append(option);
        }
        render(people);
        searchInput.addEventListener("input", () => render(people));
        roleFilter.addEventListener("change", () => render(people));
        showArchivedInput.addEventListener("change", () => render(people));
      } catch (error) {
        resultCount.textContent = "";
        const message = document.createElement("p");
        message.className = "load-error";
        message.textContent = "Trainee directory data failed to load. Please contact CNS IT";
        directory.replaceChildren(message);
        console.error("Unable to load trainee directory", error);
      }
    }

    loadDirectory();
  </script>
</body>
</html>
