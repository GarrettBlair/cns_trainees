<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Trainee Directory | Center for Neural Science</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --white: #fffefa;
      --ink: #333333;
      --muted: #666666;
      --line: #c9c9c9;
      --green: #57068c;
      --green-soft: #e4ebe3;
      --red: #963d32;
      --serif: "NYUPerstare", Helvetica, Arial, sans-serif;
      --sans: Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    a { color: inherit; }

    .masthead {
      border: 0;
      background: var(--green);
    }

    .masthead-inner,
    main,
    footer {
      width: min(1100px, calc(100% - 48px));
      margin-inline: auto;
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      min-height: 60px;
      color: #ffffff;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main { padding-block: 44px 72px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
      align-items: end;
      gap: 30px;
      padding: 20px 0 32px;
      border-bottom: 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--red);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      color: var(--green);
      font-family: var(--sans);
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.08;
      text-transform: uppercase;
    }

    .intro-copy {
      max-width: 30rem;
      margin: 14px 0 0;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(190px, 260px) auto;
      gap: 12px;
      padding-block: 24px;
    }

    .controls label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #aeb7ad;
      border-radius: 2px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
    }

    .archive-toggle {
      display: flex !important;
      align-items: center;
      gap: 8px;
      align-self: end;
      min-height: 46px;
      margin: 0;
      color: var(--ink) !important;
      font-size: 0.85rem !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
    }

    .archive-toggle input {
      width: 16px;
      min-height: 16px;
      margin: 0;
      accent-color: var(--green);
    }

    input:focus,
    select:focus,
    a:focus-visible {
      outline: 3px solid #c57758;
      outline-offset: 2px;
    }

    .directory-meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .role-section { scroll-margin-top: 20px; }

    .role-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 24px 0 0;
      padding: 8px 0 10px;
      border-bottom: 1px solid #444444;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .role-count {
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.8rem;
    }

    .person {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      animation: arrive 320ms ease both;
    }

    .person.no-photo { grid-template-columns: minmax(0, 1fr); }

    .person img {
      display: block;
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--green-soft);
    }

    .person-info { grid-column: 1; grid-row: 1; align-self: center; min-width: 0; }

    .person h3 {
      margin: 0 0 3px;
      color: var(--green);
      font-family: var(--sans);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .person-role { margin: 0 0 12px; color: var(--muted); font-weight: 700; }

    .archived-badge {
      display: inline-block;
      margin-bottom: 6px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .person-detail {
      margin: 0;
      font-size: 0.93rem;
    }

    .detail-line {
      display: grid;
      grid-template-columns: 3.5rem minmax(0, 1fr);
      align-items: baseline;
    }

    .person-detail a { min-width: 0; overflow-wrap: anywhere; color: var(--green); text-underline-offset: 3px; }
    .detail-label { color: var(--muted); }

    .empty-state,
    .load-error {
      margin: 20px 0;
      padding: 18px;
      border-left: 3px solid var(--red);
      background: var(--white);
      color: var(--muted);
    }

    .load-error code { color: var(--ink); }

    footer {
      padding-block: 18px 30px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.8rem;
    }

    [hidden] { display: none !important; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 650px) {
      .masthead-inner, main, footer { width: min(100% - 32px, 1100px); }
      main { padding-top: 38px; }
      .intro { grid-template-columns: 1fr; gap: 12px; }
      h1 { font-size: 2.35rem; }
      .controls { grid-template-columns: 1fr; gap: 14px; }
      .person { grid-template-columns: minmax(0, 1fr) 120px; gap: 16px; padding-inline: 0; }
      .person h3 { font-size: 1rem; }
      .directory-meta { align-items: baseline; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">Center for Neural Science · People</div>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <!-- <p class="eyebrow">Our community</p> -->
        <h1 id="page-title">Trainee Directory</h1>
        <p class="intro-copy">Meet the students, postdoctoral fellows, and research staff working across the Center for Neural Science.</p>
      </div>
    </section>

    <section class="controls" aria-label="Directory filters">
      <div>
        <label for="search">Search trainees</label>
        <input id="search" type="search" placeholder="Name, email, or lab" autocomplete="off">
      </div>
      <div>
        <label for="role-filter">Filter by role</label>
        <select id="role-filter"><option value="">All roles</option></select>
      </div>
      <div>
        <label class="archive-toggle" for="show-archived">
          <input id="show-archived" type="checkbox">
          See archived profiles
        </label>
      </div>
    </section>

    <div class="directory-meta" aria-live="polite">
      <span id="result-count">Loading directory…</span>
      <span id="archive-summary">Listed by role</span>
    </div>
    <div id="directory" aria-live="polite"></div>
  </main>
  <footer>Center for Neural Science</footer>

  <script type="module">
    import {
      ARCHIVE_AGE_MONTHS, PUBLISHED_CSV_URL, archiveCutoff, createFacultyLinker, groupByRole,
      isArchived, latestPeople, parseCsv, siteLinks,
    } from "./directory-core.js";

    const facultyRosterPath = "sources/faculty-directory.json";
    const imagePath = "sources/no_image.png";
    const directory = document.querySelector("#directory");
    const searchInput = document.querySelector("#search");
    const roleFilter = document.querySelector("#role-filter");
    const resultCount = document.querySelector("#result-count");
    const showArchivedInput = document.querySelector("#show-archived");
    const archiveSummary = document.querySelector("#archive-summary");
    let linkLab = (lab) => [{ text: lab }];

    function makeText(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function render(people) {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const role = roleFilter.value;
      const matchingPeople = people.filter((person) => {
        const matchesRole = !role || person.role === role;
        const haystack = `${person.name} ${person.email} ${person.lab} ${person.role} ${person.website}`.toLocaleLowerCase();
        return matchesRole && haystack.includes(query);
      });
      const cutoff = archiveCutoff(ARCHIVE_AGE_MONTHS);
      const archivedPeople = matchingPeople.filter((person) => isArchived(person, cutoff));
      const currentPeople = matchingPeople.filter((person) => !isArchived(person, cutoff));
      const visible = showArchivedInput.checked
        ? archivedPeople
        : currentPeople;
      resultCount.textContent = `${visible.length} ${visible.length === 1 ? "person" : "people"}`;
      archiveSummary.textContent = showArchivedInput.checked
        ? "Showing archived profiles"
        : `${archivedPeople.length} archived hidden`;
      directory.replaceChildren();

      if (!visible.length) {
        directory.append(makeText("p", "empty-state", "No trainees match your search."));
        return;
      }

      for (const [groupName, groupPeople] of groupByRole(visible)) {
        const section = document.createElement("section");
        section.className = "role-section";
        const heading = makeText("h2", "role-heading", groupName);
        heading.append(makeText("span", "role-count", String(groupPeople.length)));
        section.append(heading);

        for (const person of groupPeople) {
          const article = document.createElement("article");
          const archived = isArchived(person, cutoff);
          article.className = archived ? "person is-archived" : "person";
          const image = document.createElement("img");
          image.src = imagePath;
          image.alt = `Placeholder portrait for ${person.name}`;
          image.addEventListener("error", () => {
            image.remove();
            article.classList.add("no-photo");
          }, { once: true });
          article.append(image);

          const details = document.createElement("div");
          details.className = "person-info";
          details.append(makeText("h3", "", person.name));
          if (archived) details.append(makeText("span", "archived-badge", "Archived"));
          if (person.role) details.append(makeText("p", "person-role", person.role));
          const detailList = document.createElement("p");
          detailList.className = "person-detail";
          if (person.lab) {
            const labLine = makeText("span", "detail-line", "");
            labLine.append(makeText("span", "detail-label", "Lab"));
            const labValue = document.createElement("span");
            for (const segment of linkLab(person.lab)) {
              if (!segment.url) {
                labValue.append(document.createTextNode(segment.text));
                continue;
              }
              const link = document.createElement("a");
              link.href = segment.url;
              link.textContent = segment.text;
              labValue.append(link);
            }
            labLine.append(labValue);
            detailList.append(labLine);
          }
          if (person.email) {
            const emailLine = makeText("span", "detail-line", "");
            emailLine.append(makeText("span", "detail-label", "Email"));
            const emailLink = document.createElement("a");
            emailLink.href = `mailto:${person.email}`;
            emailLink.textContent = person.email;
            emailLine.append(emailLink);
            detailList.append(emailLine);
          }
          if (person.website) {
            const siteLine = makeText("span", "detail-line", "");
            siteLine.append(makeText("span", "detail-label", "Site"));
            const siteValue = document.createElement("span");
            siteLinks(person.website).forEach((site, index) => {
              if (index > 0) siteValue.append(document.createTextNode("; "));
              const siteLink = document.createElement("a");
              siteLink.href = site.href;
              siteLink.target = "_blank";
              siteLink.rel = "noopener noreferrer";
              siteLink.textContent = site.text;
              siteValue.append(siteLink);
            });
            siteLine.append(siteValue);
            detailList.append(siteLine);
          }
          details.append(detailList);
          article.append(details);
          section.append(article);
        }
        directory.append(section);
      }
    }

    async function loadDirectory() {
      try {
        const facultyResponse = await fetch(facultyRosterPath);
        if (!facultyResponse.ok) throw new Error(`Faculty roster request returned ${facultyResponse.status}`);
        const facultyRoster = await facultyResponse.json();
        linkLab = createFacultyLinker(Array.isArray(facultyRoster.faculty) ? facultyRoster.faculty : []);
      } catch (error) {
        console.warn("Unable to load faculty profile links", error);
      }

      try {
        const response = await fetch(PUBLISHED_CSV_URL);
        if (!response.ok) throw new Error(`CSV request returned ${response.status}`);
        const people = latestPeople(parseCsv(await response.text()));
        const roles = [...new Set(people.map((person) => person.role).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        for (const role of roles) {
          const option = document.createElement("option");
          option.value = role;
          option.textContent = role;
          roleFilter.append(option);
        }
        render(people);
        searchInput.addEventListener("input", () => render(people));
        roleFilter.addEventListener("change", () => render(people));
        showArchivedInput.addEventListener("change", () => render(people));
      } catch (error) {
        resultCount.textContent = "";
        const message = document.createElement("p");
        message.className = "load-error";
        message.textContent = "Trainee directory data failed to load. Please contact CNS IT";
        directory.replaceChildren(message);
        console.error("Unable to load trainee directory", error);
      }
    }

    loadDirectory();
  </script>
</body>
</html>
